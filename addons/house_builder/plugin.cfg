name="House Builder"
description="Design houses on a per-floor grid and generate the exterior shell as a mesh: foundation, walls, trim, straight-skeleton roofs, porches, windows, doors, dormers, chimneys, and gutters. Exports each house as a ready-to-instance scene with meter-true UVs, per-slot materials, and primitive collision."
